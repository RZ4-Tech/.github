name: Bug
description: Algo que funcionava ou deveria funcionar e não funciona
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: E o que era esperado no lugar.
    validations:
      required: true
  - type: textarea
    id: como
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Logar como dono da loja X
        2. Abrir a agenda de amanhã
        3. ...
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options: [PRD, QA, local]
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Print, log, ID do tenant/registro.
